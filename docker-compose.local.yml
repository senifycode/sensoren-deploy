version: '3.8'

# Local development / feature testing compose
# Usage: docker compose -f docker-compose.local.yml up --build
# Copy .env.example to .env and adjust values before first run.

networks:
  sensoren-network:
    driver: bridge

services:
  # ==========================================
  # MySQL Database
  # ==========================================
  db:
    image: mysql:8.0
    container_name: senify-db
    restart: unless-stopped
    networks:
      - sensoren-network
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-senify}
      MYSQL_USER: ${MYSQL_USER:-prisma}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./volumes/db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER:-prisma}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==========================================
  # DB Init: run migrations + seed
  # ==========================================
  db-init:
    build:
      context: ..
      dockerfile: sensoren-deploy/Dockerfile.db-init
    container_name: senify-db-init
    restart: on-failure
    networks:
      - sensoren-network
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

  # ==========================================
  # WebSocket Service (Socket.IO + gRPC)
  # ==========================================
  websocket-service:
    build:
      context: ../websocket-service
      dockerfile: Dockerfile
    container_name: websocket-service
    restart: unless-stopped
    networks:
      - sensoren-network
    ports:
      - "8091:8091"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=${DATABASE_URL}
      - ORIGIN=${ORIGIN:-http://localhost:3000}
      - WSS_RPC_URL=${WSS_RPC_URL:-websocket-service:8091}
      - WSS_SERVICE_URL=${WSS_SERVICE_URL:-http://websocket-service:8081}
    depends_on:
      db-init:
        condition: service_completed_successfully

  # ==========================================
  # Broker Service (MQTT + gRPC)
  # ==========================================
  broker-service:
    build:
      context: ../broker-service
      dockerfile: Dockerfile
    container_name: broker-service
    restart: unless-stopped
    networks:
      - sensoren-network
    ports:
      - "1883:1883"   # MQTT plaintext
      - "8883:8883"   # MQTT over TLS
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=${DATABASE_URL}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - BROKER_RPC_URL=${BROKER_RPC_URL:-broker-service:8081}
      - WSS_RPC_URL=${WSS_RPC_URL:-websocket-service:8091}
      - BACKUP_RPC_URL=${BACKUP_RPC_URL:-backup-service:8101}
    volumes:
      - ./volumes/ssl:/ssl:ro
      - ./volumes/broker-data:/data
    depends_on:
      db-init:
        condition: service_completed_successfully
      websocket-service:
        condition: service_started

  # ==========================================
  # Backup Service (gRPC)
  # ==========================================
  backup-service:
    build:
      context: ../backup-service
      dockerfile: Dockerfile
    container_name: backup-service
    restart: unless-stopped
    networks:
      - sensoren-network
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=${DATABASE_URL}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - BACKUP_RPC_URL=${BACKUP_RPC_URL:-backup-service:8101}
    volumes:
      - ./volumes/backups:/backups
    depends_on:
      db-init:
        condition: service_completed_successfully

  # ==========================================
  # Main Service (SvelteKit)
  # ==========================================
  sensoren-server:
    build:
      context: ../Sensoren-Server
      dockerfile: DockerfileBUN
    container_name: sensoren-server
    restart: unless-stopped
    networks:
      - sensoren-network
    ports:
      - "3000:3000"
    environment:
      - ORIGIN=${ORIGIN:-http://localhost:3000}
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=${DATABASE_URL}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-10}
      - IMG_STOREAGE_PATH=/images
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - PLANE_API_KEY=${PLANE_API_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - BROKER_RPC_URL=${BROKER_RPC_URL:-broker-service:8081}
      - WSS_SERVICE_URL=${WSS_SERVICE_URL:-http://websocket-service:8081}
      - WSS_RPC_URL=${WSS_RPC_URL:-websocket-service:8091}
      - BACKUP_RPC_URL=${BACKUP_RPC_URL:-backup-service:8101}
    volumes:
      - ./volumes/images:/images
    depends_on:
      db-init:
        condition: service_completed_successfully
      broker-service:
        condition: service_started
      websocket-service:
        condition: service_started
      backup-service:
        condition: service_started
