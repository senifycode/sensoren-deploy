services:
    db:
        image: mysql:8.0
        container_name: senify-db
        restart: unless-stopped
        ports:
            - '3307:3306'
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${MYSQL_DATABASE:-senify}
            MYSQL_USER: ${MYSQL_USER:-prisma}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        volumes:
            - db-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u${MYSQL_USER:-prisma}', '-p${MYSQL_PASSWORD}']
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

    db-init:
        build:
            context: .
            dockerfile: Dockerfile.db-init
        container_name: senify-db-init
        restart: on-failure
        environment:
            - DATABASE_URL=${DATABASE_URL}
        depends_on:
            db:
                condition: service_healthy
        exclude_from_hc: true

    websocket-service:
        build:
            context: ./websocket-service
            dockerfile: Dockerfile
        container_name: websocket-service
        restart: unless-stopped
        environment:
            - NODE_ENV=${NODE_ENV:-production}
            - DATABASE_URL=${DATABASE_URL}
            - ORIGIN=${ORIGIN:-https://sensore.senify.de}
            - WSS_RPC_URL=${WSS_RPC_URL:-websocket-service:8091}
            - WSS_SERVICE_URL=${WSS_SERVICE_URL:-http://websocket-service:8081}
        # healthcheck:
        #     test: ['CMD', 'curl', '-f', 'http://localhost:8091/health']
        #     interval: 30s
        #     timeout: 10s
        #     retries: 3
        depends_on:
            db-init:
                condition: service_completed_successfully
        exclude_from_hc: true

    broker-service:
        build:
            context: ./broker-service
            dockerfile: Dockerfile
        container_name: broker-service
        restart: unless-stopped
        ports:
            - '1883:1883'
            - '8883:8883'
        environment:
            - NODE_ENV=${NODE_ENV:-production}
            - DATABASE_URL=${DATABASE_URL}
            - MQTT_PASSWORD=${MQTT_PASSWORD}
            - BROKER_RPC_URL=${BROKER_RPC_URL:-broker-service:8081}
            - WSS_RPC_URL=${WSS_RPC_URL:-websocket-service:8091}
            - BACKUP_RPC_URL=${BACKUP_RPC_URL:-backup-service:8101}
        volumes:
            - ./volumes/ssl:/ssl:ro
        # healthcheck:
        #     test: ['CMD', 'curl', '-f', 'http://localhost:8081/health']
        #     interval: 30s
        #     timeout: 10s
        #     retries: 3
        depends_on:
            db-init:
                condition: service_completed_successfully
            websocket-service:
                condition: service_started
        exclude_from_hc: true

    backup-service:
        build:
            context: ./backup-service
            dockerfile: Dockerfile
        container_name: backup-service
        restart: unless-stopped
        environment:
            - NODE_ENV=${NODE_ENV:-production}
            - DATABASE_URL=${DATABASE_URL}
            - ENCRYPTION_KEY=${ENCRYPTION_KEY}
            - BACKUP_RPC_URL=${BACKUP_RPC_URL:-backup-service:8101}
        volumes:
            - ./volumes/backups:/backups
        # healthcheck:
        #     test: ['CMD', 'curl', '-f', 'http://localhost:8101/health']
        #     interval: 30s
        #     timeout: 10s
        #     retries: 3
        depends_on:
            db-init:
                condition: service_completed_successfully
        exclude_from_hc: true

    sensoren-server:
        build:
            context: ./sensoren-server
            dockerfile: DockerfileBUN
        container_name: sensoren-server
        restart: unless-stopped
        environment:
            - SERVICE_FQDN_SENIFY_3000
            - ORIGIN=${ORIGIN:-https://sensore.senify.de}
            - NODE_ENV=${NODE_ENV:-production}
            - DATABASE_URL=${DATABASE_URL}
            - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-12}
            - IMG_STOREAGE_PATH=/images
            - MQTT_PASSWORD=${MQTT_PASSWORD}
            - MQTT_PORT=${MQTT_PORT:-8883}
            - PLANE_API_KEY=${PLANE_API_KEY}
            - ENCRYPTION_KEY=${ENCRYPTION_KEY}
            - BROKER_RPC_URL=${BROKER_RPC_URL:-broker-service:8081}
            - WSS_SERVICE_URL=${WSS_SERVICE_URL:-http://websocket-service:8081}
            - WSS_RPC_URL=${WSS_RPC_URL:-websocket-service:8091}
            - BACKUP_RPC_URL=${BACKUP_RPC_URL:-backup-service:8101}
        volumes:
            - ./volumes/images:/images
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://127.0.0.1:3000']
            interval: 30s
            timeout: 10s
            retries: 15
        depends_on:
            db-init:
                condition: service_completed_successfully
            broker-service:
                condition: service_started
            websocket-service:
                condition: service_started
            backup-service:
                condition: service_started
